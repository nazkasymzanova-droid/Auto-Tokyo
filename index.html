<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Автозапчасти — учёт склада</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e3e6eb;--ac:#d9480f;--acx:#fff;--ok:#2b8a3e;--bad:#c92a2a;--warn:#e67700;--hd:#1b1f27;--hdt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mu:#9aa1ad;--bd:#2c323c;--ac:#ff7a3d;--acx:#14171c;--ok:#51cf66;--bad:#ff6b6b;--warn:#ffa94d;--hd:#0d0f13}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mu:#9aa1ad;--bd:#2c323c;--ac:#ff7a3d;--acx:#14171c;--ok:#51cf66;--bad:#ff6b6b;--warn:#ffa94d;--hd:#0d0f13}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--hd);color:var(--hdt);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px}
button.p,.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.s{padding:3px 8px;font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;white-space:nowrap;color:var(--mu)}
nav button.on{background:var(--ac);color:var(--acx);font-weight:600}
main{padding:14px;max-width:1200px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px}
.k b{display:block;font-size:20px}.k span{color:var(--mu);font-size:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
.box h2{font-size:15px;margin:0 0 8px}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;min-width:90px}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:6px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600}
td.n,th.n{text-align:right}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.muted{color:var(--mu)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--hd);color:var(--hdt);padding:9px 16px;border-radius:8px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<header>
  <h1>🔧 Автозапчасти — склад и учёт</h1>
  <div class="bar">
    <label class="btn p" style="flex-direction:row;color:var(--acx)">⬆ Загрузить товары из Excel<input type="file" id="fx" accept=".xlsx,.xls,.csv" hidden></label>
    <button id="bx">⬇ Excel-отчёт за день</button>
    <button id="bt">Шаблон Excel</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="v"></main>
<div id="toast"></div>
<script>
const T=[["stock","Остатки"],["buy","Закупки"],["sell","Продажи"],["def","Дефицит"],["prof","Прибыльность"],["ord","Заказы поставщикам"]];
let S={p:[],buy:[],sell:[],ord:[]},tab="stock",q="";
try{const r=localStorage.getItem("autoparts");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("autoparts",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=n=>(Math.round(n*100)/100).toLocaleString("ru-RU")+" ₸";
const today=()=>new Date().toISOString().slice(0,10);
const P=k=>S.p.find(x=>x.sku===k);
const toast=t=>{const d=$("#toast");d.textContent=t;d.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>d.style.display="none",3000)};
const opts=()=>S.p.map(x=>`<option value="${e(x.sku)}">${e(x.sku)} — ${e(x.name)}</option>`).join("");
const tbl=(h,rows,nc=[])=>`<div class="w"><table><tr>${h.map((x,i)=>`<th class="${nc.includes(i)?"n":""}">${x}</th>`).join("")}</tr>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${nc.includes(i)?"n":""}">${c}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${h.length}" class="muted">Нет данных</td></tr>`}</table></div>`;
const need=p=>Math.max(p.min*2-p.qty,1);

function stats(){
  const r={};S.p.forEach(p=>r[p.sku]={rev:0,cost:0,qty:0});
  S.sell.forEach(s=>{const a=r[s.sku];if(a){a.rev+=s.qty*s.price;a.cost+=s.qty*s.cost;a.qty+=s.qty}});
  return r;
}
function nav(){
  $("#nav").innerHTML=T.map(([k,n])=>`<button class="${k===tab?"on":""}" data-t="${k}">${n}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
}
function render(){
  nav();const v=$("#v");
  const val=S.p.reduce((a,p)=>a+p.qty*p.buy,0),low=S.p.filter(p=>p.qty<=p.min).length;
  const st=stats(),rev=Object.values(st).reduce((a,x)=>a+x.rev,0),pr=rev-Object.values(st).reduce((a,x)=>a+x.cost,0);
  let h=`<div class="cards"><div class="k"><b>${S.p.length}</b><span>позиций</span></div><div class="k"><b>${m(val)}</b><span>стоимость склада (закупка)</span></div><div class="k"><b class="${low?"bad":"ok"}">${low}</b><span>в дефиците</span></div><div class="k"><b>${m(rev)}</b><span>выручка</span></div><div class="k"><b class="${pr>=0?"ok":"bad"}">${m(pr)}</b><span>прибыль</span></div></div>`;
  if(tab==="stock"){
    const L=S.p.filter(p=>(p.sku+p.name+p.brand+p.cat).toLowerCase().includes(q.toLowerCase()));
    h+=`<div class="box"><h2>Добавить / изменить товар</h2><form id="fp"><label>Артикул<input name="sku" required></label><label>Название<input name="name" required></label><label>Бренд<input name="brand"></label><label>Категория<input name="cat"></label><label>Закупка ₸<input name="buy" type="number" step="any" min="0" required></label><label>Продажа ₸<input name="sell" type="number" step="any" min="0" required></label><label>Остаток<input name="qty" type="number" min="0" value="0"></label><label>Мин. остаток<input name="min" type="number" min="0" value="2"></label><label>Поставщик<input name="sup"></label><button class="p">Сохранить</button></form></div>
    <div class="box"><h2>Остатки на складе</h2><label style="margin-bottom:8px">Поиск<input id="q" value="${e(q)}" placeholder="артикул, название, бренд"></label>${tbl(["Артикул","Название","Бренд","Категория","Закупка","Продажа","Остаток","Мин.","Поставщик",""],L.map(p=>[e(p.sku),e(p.name),e(p.brand),e(p.cat),m(p.buy),m(p.sell),`<b class="${p.qty<=0?"bad":p.qty<=p.min?"warn":"ok"}">${p.qty}</b>`,p.min,e(p.sup),`<button class="s" data-del="${e(p.sku)}">✕</button>`]),[4,5,6,7])}</div>`;
    if(!S.p.length)h+=`<button id="demo">Загрузить демо-данные</button>`;
  }
  if(tab==="buy"){
    h+=`<div class="box"><h2>Новая закупка (приход на склад)</h2><form id="fb"><label>Дата<input name="d" type="date" value="${today()}"></label><label>Товар<select name="sku" required>${opts()}</select></label><label>Кол-во<input name="qty" type="number" min="1" required></label><label>Цена закупки ₸<input name="price" type="number" step="any" min="0" required></label><label>Поставщик<input name="sup"></label><button class="p">Оприходовать</button></form></div>
    <div class="box"><h2>Журнал закупок</h2>${tbl(["Дата","Артикул","Товар","Кол-во","Цена","Сумма","Поставщик"],[...S.buy].reverse().map(b=>[b.d,e(b.sku),e(P(b.sku)?.name),b.qty,m(b.price),m(b.qty*b.price),e(b.sup)]),[3,4,5])}</div>`;
  }
  if(tab==="sell"){
    h+=`<div class="box"><h2>Новая продажа (списание со склада)</h2><form id="fs"><label>Дата<input name="d" type="date" value="${today()}"></label><label>Товар<select name="sku" required>${opts()}</select></label><label>Кол-во<input name="qty" type="number" min="1" required></label><label>Цена продажи ₸ (пусто = прайс)<input name="price" type="number" step="any" min="0"></label><button class="p">Продать</button></form></div>
    <div class="box"><h2>Журнал продаж</h2>${tbl(["Дата","Артикул","Товар","Кол-во","Цена","Сумма","Прибыль"],[...S.sell].reverse().map(s=>[s.d,e(s.sku),e(P(s.sku)?.name),s.qty,m(s.price),m(s.qty*s.price),`<span class="${s.price>=s.cost?"ok":"bad"}">${m(s.qty*(s.price-s.cost))}</span>`]),[3,4,5,6])}</div>`;
  }
  if(tab==="def"){
    const D=S.p.filter(p=>p.qty<=p.min).sort((a,b)=>a.qty-b.qty);
    h+=`<div class="box"><h2>Контроль дефицита</h2><p class="muted">Товары, остаток которых не выше минимального. Рекомендуемый заказ — до уровня «2 × минимум».</p>${tbl(["Артикул","Название","Остаток","Мин.","Статус","Рекомендуем заказать","Поставщик",""],D.map(p=>[e(p.sku),e(p.name),p.qty,p.min,p.qty<=0?`<span class="tag bad">нет в наличии</span>`:`<span class="tag warn">мало</span>`,need(p),e(p.sup),`<button class="s p" data-mk="${e(p.sku)}">Создать заказ</button>`]),[2,3,5])}${D.length?`<p><button id="mkall" class="p">Создать заказы на все позиции</button></p>`:""}</div>`;
  }
  if(tab==="prof"){
    const R=S.p.map(p=>{const a=st[p.sku];return{p,a,pf:a.rev-a.cost,mg:a.rev?(a.rev-a.cost)/a.rev*100:0,mk:p.buy?(p.sell-p.buy)/p.buy*100:0}}).sort((x,y)=>y.pf-x.pf);
    h+=`<div class="box"><h2>Анализ прибыльности деталей</h2>${tbl(["Артикул","Название","Продано шт.","Выручка","Себестоимость","Прибыль","Маржа %","Наценка по прайсу %","Оценка"],R.map(r=>[e(r.p.sku),e(r.p.name),r.a.qty,m(r.a.rev),m(r.a.cost),`<b class="${r.pf>=0?"ok":"bad"}">${m(r.pf)}</b>`,r.a.rev?r.mg.toFixed(1):"—",r.mk.toFixed(1),!r.a.qty?`<span class="tag muted">нет продаж</span>`:r.mg>=30?`<span class="tag ok">топ</span>`:r.mg>=15?`<span class="tag warn">средне</span>`:`<span class="tag bad">низкая</span>`]),[2,3,4,5,6,7])}</div>`;
  }
  if(tab==="ord"){
    h+=`<div class="box"><h2>Новый заказ поставщику</h2><form id="fo"><label>Поставщик<input name="sup" required></label><label>Товар<select name="sku" required>${opts()}</select></label><label>Кол-во<input name="qty" type="number" min="1" required></label><button class="p">Создать</button></form></div>
    <div class="box"><h2>Заказы поставщикам</h2>${tbl(["№","Дата","Поставщик","Артикул","Товар","Кол-во","Статус","Действие"],[...S.ord].reverse().map(o=>[o.id,o.d,e(o.sup),e(o.sku),e(P(o.sku)?.name),o.qty,`<span class="tag ${o.st==="Получен"?"ok":o.st==="Заказан"?"warn":"muted"}">${o.st}</span>`,o.st==="Новый"?`<button class="s" data-st="${o.id}|Заказан">Отправлен</button>`:o.st==="Заказан"?`<button class="s p" data-st="${o.id}|Получен">Принять на склад</button>`:""]),[5])}</div>`;
  }
  v.innerHTML=h;bind();
}
function fd(f){return Object.fromEntries(new FormData(f))}
function mkOrder(sku){
  const p=P(sku);if(!p)return;
  if(S.ord.some(o=>o.sku===sku&&o.st!=="Получен"))return false;
  S.ord.push({id:S.ord.length?Math.max(...S.ord.map(o=>o.id))+1:1,d:today(),sup:p.sup||"—",sku,qty:need(p),st:"Новый"});return true;
}
function bind(){
  const on=(id,fn)=>{const f=$(id);if(f)f.onsubmit=ev=>{ev.preventDefault();fn(fd(f));save();render()}};
  on("#fp",o=>{const x={sku:o.sku.trim(),name:o.name,brand:o.brand,cat:o.cat,buy:+o.buy,sell:+o.sell,qty:+o.qty||0,min:+o.min||0,sup:o.sup},i=S.p.findIndex(p=>p.sku===x.sku);i<0?S.p.push(x):S.p[i]=x;toast("Товар сохранён")});
  on("#fb",o=>{const p=P(o.sku);p.qty+=+o.qty;p.buy=+o.price;if(o.sup)p.sup=o.sup;S.buy.push({d:o.d,sku:o.sku,qty:+o.qty,price:+o.price,sup:o.sup||p.sup});toast("Закупка оприходована")});
  on("#fs",o=>{const p=P(o.sku),n=+o.qty;if(n>p.qty){toast(`Недостаточно на складе: ${p.qty} шт.`);return}p.qty-=n;S.sell.push({d:o.d,sku:o.sku,qty:n,price:o.price===""?p.sell:+o.price,cost:p.buy});toast(p.qty<=p.min?"Продано. Остаток ниже минимума!":"Продажа проведена")});
  on("#fo",o=>{S.ord.push({id:S.ord.length?Math.max(...S.ord.map(x=>x.id))+1:1,d:today(),sup:o.sup,sku:o.sku,qty:+o.qty,st:"Новый"});toast("Заказ создан")});
  const qi=$("#q");if(qi)qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Удалить товар?")){S.p=S.p.filter(p=>p.sku!==b.dataset.del);save();render()}});
  document.querySelectorAll("[data-mk]").forEach(b=>b.onclick=()=>{toast(mkOrder(b.dataset.mk)?"Заказ создан":"Открытый заказ уже есть");save();tab="ord";render()});
  const ma=$("#mkall");if(ma)ma.onclick=()=>{let c=0;S.p.filter(p=>p.qty<=p.min).forEach(p=>{if(mkOrder(p.sku))c++});toast(`Создано заказов: ${c}`);save();tab="ord";render()};
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const[id,st]=b.dataset.st.split("|"),o=S.ord.find(x=>x.id==id);o.st=st;if(st==="Получен"){const p=P(o.sku);if(p){p.qty+=o.qty;S.buy.push({d:today(),sku:o.sku,qty:o.qty,price:p.buy,sup:o.sup})}toast("Товар принят на склад")}save();render()});
  const d=$("#demo");if(d)d.onclick=()=>{S.p=[["BR-1021","Тормозные колодки передние","Brembo","Тормоза",9500,14500,12,5,"АвтоОпт"],["FL-330","Масляный фильтр","Mann","Фильтры",1800,3200,3,10,"АвтоОпт"],["SP-77","Свеча зажигания","NGK","Зажигание",900,1800,40,16,"ТехПоставка"],["OL-5W30","Масло 5W30 4л","Castrol","Масла",12000,17500,0,6,"ТехПоставка"],["SH-210","Амортизатор передний","KYB","Подвеска",18000,24000,6,4,"АвтоОпт"]].map(a=>({sku:a[0],name:a[1],brand:a[2],cat:a[3],buy:a[4],sell:a[5],qty:a[6],min:a[7],sup:a[8]}));save();render()};
}
const H={sku:["артикул","sku","код"],name:["название","наименование","name","товар"],brand:["бренд","производитель","brand"],cat:["категория","группа","category"],buy:["закупка","закупочная","цена закупки","себестоимость","buy"],sell:["продажа","розница","цена продажи","цена","price"],qty:["остаток","количество","кол-во","qty"],min:["мин. остаток","мин","минимум","min"],sup:["поставщик","supplier"]};
function pick(r,k){const ks=Object.keys(r);for(const a of H[k]){const f=ks.find(x=>x.trim().toLowerCase()===a);if(f)return r[f]}return undefined}
$("#fx").onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    let add=0,upd=0;
    rows.forEach(r=>{
      const sku=String(pick(r,"sku")??"").trim();if(!sku)return;
      const old=P(sku),x={sku,name:String(pick(r,"name")??old?.name??""),brand:String(pick(r,"brand")??old?.brand??""),cat:String(pick(r,"cat")??old?.cat??""),buy:+(pick(r,"buy")??old?.buy??0)||0,sell:+(pick(r,"sell")??old?.sell??0)||0,qty:+(pick(r,"qty")??old?.qty??0)||0,min:+(pick(r,"min")??old?.min??2)||0,sup:String(pick(r,"sup")??old?.sup??"")};
      if(old){Object.assign(old,x);upd++}else{S.p.push(x);add++}
    });
    save();tab="stock";render();toast(`Загружено: новых ${add}, обновлено ${upd}`);
  }catch(err){toast("Не удалось прочитать файл Excel")}
  ev.target.value="";
};
async function dl(wb,name){
  const dls=(typeof claude!=="undefined"&&claude.use)?await claude.use("downloads").catch(()=>null):null;
  if(!dls){XLSX.writeFile(wb,name);return}
  try{await dls.save({filename:name,data:new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})])})}catch(err){if(err&&err.code!=="declined")toast("Не удалось сохранить файл")}
}
$("#bx").onclick=()=>{
  const d=today(),st=stats(),wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a.length?a:[{"":""}]),n);
  add("Остатки",S.p.map(p=>({"Артикул":p.sku,"Название":p.name,"Бренд":p.brand,"Категория":p.cat,"Закупка":p.buy,"Продажа":p.sell,"Остаток":p.qty,"Мин. остаток":p.min,"Поставщик":p.sup,"Дефицит":p.qty<=p.min?"да":""})));
  add("Продажи за день",S.sell.filter(s=>s.d===d).map(s=>({"Дата":s.d,"Артикул":s.sku,"Товар":P(s.sku)?.name,"Кол-во":s.qty,"Цена":s.price,"Сумма":s.qty*s.price,"Прибыль":s.qty*(s.price-s.cost)})));
  add("Закупки за день",S.buy.filter(b=>b.d===d).map(b=>({"Дата":b.d,"Артикул":b.sku,"Товар":P(b.sku)?.name,"Кол-во":b.qty,"Цена":b.price,"Сумма":b.qty*b.price,"Поставщик":b.sup})));
  add("Дефицит",S.p.filter(p=>p.qty<=p.min).map(p=>({"Артикул":p.sku,"Название":p.name,"Остаток":p.qty,"Мин. остаток":p.min,"Заказать":need(p),"Поставщик":p.sup})));
  add("Прибыльность",S.p.map(p=>{const a=st[p.sku];return{"Артикул":p.sku,"Название":p.name,"Продано":a.qty,"Выручка":a.rev,"Себестоимость":a.cost,"Прибыль":a.rev-a.cost}}));
  add("Заказы",S.ord.map(o=>({"№":o.id,"Дата":o.d,"Поставщик":o.sup,"Артикул":o.sku,"Кол-во":o.qty,"Статус":o.st})));
  dl(wb,`otchet_${d}.xlsx`);
};
$("#bt").onclick=()=>{
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Артикул","Название","Бренд","Категория","Закупка","Продажа","Остаток","Мин. остаток","Поставщик"],["BR-1021","Тормозные колодки передние","Brembo","Тормоза",9500,14500,12,5,"АвтоОпт"]]),"Товары");
  dl(wb,"shablon_tovary.xlsx");
};
render();
</script>
